spring:
  application:
    name: planshift-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:planshift}
    username: ${DB_USER:planshift}
    password: ${DB_PASSWORD:planshift}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  # Render (and most PaaS hosts) inject PORT; local/docker-compose use
  # SERVER_PORT. PORT wins when both are set.
  port: ${PORT:${SERVER_PORT:8080}}

planshift:
  dataset:
    # Defaults used by --generate-data when --scale isn't "full" (and not
    # overridden by --customers/--products/--orders/--max-items/--seed).
    # --scale=full always uses the fixed 100k/500k preset regardless of
    # these -- they're for the fast dev-scale default and any other custom
    # scale you want without touching code.
    seed: ${DATASET_SEED:42}
    customers: ${DATASET_CUSTOMERS:1000}
    products: ${DATASET_PRODUCTS:200}
    orders: ${DATASET_ORDERS:5000}
    max-items-per-order: ${DATASET_MAX_ITEMS_PER_ORDER:5}
