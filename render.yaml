databases:
  - name: planshift-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: planshift-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: planshift-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: planshift-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: planshift-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: planshift-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: planshift-db
          property: password
      # Set this to your deployed frontend's origin once you have it
      # (e.g. https://planshift.vercel.app), no trailing slash.
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173
