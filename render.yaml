services:
  - type: web
    name: planshift-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # Postgres lives on Neon (free tier, no expiry). Values come from the
      # Neon dashboard; set them in Render, not here.
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PARAMS
        value: "?sslmode=require"
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,https://frontend-mauve-two-60.vercel.app
